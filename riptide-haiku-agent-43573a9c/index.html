<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Calculator</title>
    <meta
      name="description"
      content="A small dependency-free web calculator with full keyboard support."
    />
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>"
    />
  </head>
  <body>
    <main class="calculator">
      <h1 class="visually-hidden">Calculator</h1>

      <div class="display">
        <div class="display__expression" id="expression" aria-hidden="true"></div>
        <output
          class="display__current"
          id="display"
          aria-live="polite"
          aria-label="Result"
          >0</output
        >
      </div>

      <div class="keypad">
        <button class="key key--function" data-action="clear" aria-label="Clear all">
          AC
        </button>
        <button class="key key--function" data-action="backspace" aria-label="Backspace">
          ⌫
        </button>
        <button class="key key--function" data-action="percent" aria-label="Percent">
          %
        </button>
        <button
          class="key key--operator"
          data-action="operator"
          data-value="÷"
          aria-label="Divide"
        >
          ÷
        </button>

        <button class="key" data-action="digit" data-value="7">7</button>
        <button class="key" data-action="digit" data-value="8">8</button>
        <button class="key" data-action="digit" data-value="9">9</button>
        <button
          class="key key--operator"
          data-action="operator"
          data-value="×"
          aria-label="Multiply"
        >
          ×
        </button>

        <button class="key" data-action="digit" data-value="4">4</button>
        <button class="key" data-action="digit" data-value="5">5</button>
        <button class="key" data-action="digit" data-value="6">6</button>
        <button
          class="key key--operator"
          data-action="operator"
          data-value="-"
          aria-label="Subtract"
        >
          −
        </button>

        <button class="key" data-action="digit" data-value="1">1</button>
        <button class="key" data-action="digit" data-value="2">2</button>
        <button class="key" data-action="digit" data-value="3">3</button>
        <button
          class="key key--operator"
          data-action="operator"
          data-value="+"
          aria-label="Add"
        >
          +
        </button>

        <button class="key" data-action="negate" aria-label="Toggle sign">±</button>
        <button class="key" data-action="digit" data-value="0">0</button>
        <button class="key" data-action="decimal" aria-label="Decimal point">.</button>
        <button
          class="key key--equals"
          data-action="equals"
          aria-label="Equals"
        >
          =
        </button>
      </div>

      <p class="hint">
        Tip: use your keyboard — digits, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd>
        <kbd>/</kbd>, <kbd>Enter</kbd> to evaluate, <kbd>Esc</kbd> to clear.
      </p>
    </main>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
